<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Astrologia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #3b1e64 50%, #6d3b9e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        #canvas-signos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            /* Mais largo para a tabela */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            color: #e0b0ff;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #c77dff;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        td {
            color: #ddd;
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-voltar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #9d4edd;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #c77dff;
        }
    </style>
</head>

<body>
    <canvas id="canvas-signos"></canvas>

    <div class="container">
        <h1>🛠️ Painel de Controle (Admin)</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Nascimento</th>
                    <th>Signo</th>
                    <th>Data do Cadastro</th>
                </tr>
            </thead>
            <tbody>
                {% for p in pessoas %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td>{{ p.nome }}</td>
                    <td>{{ p.nascimento }}</td>
                    <td style="color: #e0b0ff; font-weight: bold;">{{ p.signo }}</td>
                    <td>{{ p.cadastro }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="text-align: center;">Nenhum cadastro encontrado no banco.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="/" class="btn-voltar">↩ Voltar para o site</a>
    </div>

    <script>
        // Mesmo script dos símbolos caindo
        const canvas = document.getElementById('canvas-signos');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        const simbolos = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];
        let particulas = [];
        let mouse = { x: -1000, y: -1000, radius: 100 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        class Particula {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * -height;
                this.size = Math.random() * 20 + 15; this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.simbolo = simbolos[Math.floor(Math.random() * simbolos.length)];
                this.opacity = Math.random() * 0.4 + 0.1; this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 2 - 1;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX; this.rotation += this.rotSpeed;
                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    let force = (mouse.radius - distance) / mouse.radius;
                    this.x -= (dx / distance) * force * 5; this.y -= (dy / distance) * force * 5;
                }
                if (this.y > height + 50) { this.y = -50; this.x = Math.random() * width; }
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = `rgba(224, 176, 255, ${this.opacity})`; ctx.font = `${this.size}px Arial`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(this.simbolo, 0, 0);
                ctx.restore();
            }
        }
        for (let i = 0; i < 80; i++) { particulas.push(new Particula()); }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particulas.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>

</html>
